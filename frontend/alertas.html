<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alertas · NovaSalud POS</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="app">
  <div class="principal">
    <header class="topbar" id="topbar"></header>
    <main class="contenido" id="contenido">
      <div class="al-layout">
        <section class="panel lista">
          <div class="panel-cab">
            <h2>
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
              Alertas
            </h2>
          </div>
          <div class="pestanas" id="pestanas" role="tablist" aria-label="Tipo de alerta"></div>
          <div id="tabla" aria-live="polite"><p class="vacio">Cargando alertas…</p></div>
        </section>

        <aside class="panel al-lateral">
          <div class="al-icono">
            <svg viewBox="0 0 24 24" width="54" height="54" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
          </div>
          <h3>Mantén tu inventario siempre actualizado</h3>
          <p>Registra los ingresos de mercadería para que las alertas de stock bajo se cierren solas.</p>
          <a class="btn btn-cobrar" href="inventario.html">Ver inventario</a>
        </aside>
      </div>
    </main>
  </div>

  <div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/alertas.js"></script>
</body>
</html>
