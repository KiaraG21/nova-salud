<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auditoría · NovaSalud POS</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="app">
  <div class="principal">
    <header class="topbar" id="topbar"></header>
    <main class="contenido" id="contenido">
      <section class="panel lista">
        <div class="panel-cab">
          <h2>
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4"/></svg>
            Auditoría
          </h2>
        </div>

        <div class="filtros">
          <label class="filtro"><select id="f-usuario" aria-label="Usuario"><option value="">Todos los usuarios</option></select></label>
          <label class="filtro"><select id="f-accion" aria-label="Acción"><option value="">Todas las acciones</option></select></label>
          <label class="filtro">Del: <input type="date" id="desde"></label>
          <label class="filtro">Al: <input type="date" id="hasta"></label>
          <label class="pv-buscar filtro-buscar">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input id="q" type="search" placeholder="Buscar…" autocomplete="off" aria-label="Buscar en la auditoría">
          </label>
        </div>

        <p class="alerta-error" id="a-error" role="alert"></p>
        <div id="tabla" aria-live="polite"><p class="vacio">Cargando registros…</p></div>
        <div class="paginacion" id="paginacion"></div>
      </section>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auditoria.js"></script>
</body>
</html>
