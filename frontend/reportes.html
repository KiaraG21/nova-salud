<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reportes · NovaSalud POS</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="app">
  <div class="principal">
    <header class="topbar" id="topbar"></header>
    <main class="contenido" id="contenido">
      <section class="panel lista">
        <div class="panel-cab">
          <h2>
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>
            Reportes
          </h2>
        </div>

        <div class="rep-layout">
          <nav class="rep-menu" id="rep-menu" aria-label="Tipo de reporte">
            <button class="rep-op activa" data-tipo="ventas_dia" type="button">Ventas por día</button>
            <button class="rep-op" data-tipo="top_productos" type="button">Productos más vendidos</button>
            <button class="rep-op" data-tipo="stock_critico" type="button">Stock crítico</button>
          </nav>
          <div class="rep-cuadro">
            <div class="rep-cab">
              <h3 id="rep-titulo">Ventas por día</h3>
              <label class="filtro" id="rep-periodo-caja">
                <select id="rep-periodo" aria-label="Periodo">
                  <option value="mes">Este mes</option>
                  <option value="mes_ant">Mes anterior</option>
                  <option value="7">Últimos 7 días</option>
                  <option value="30">Últimos 30 días</option>
                </select>
              </label>
            </div>
            <div id="rep-resumen" class="rep-resumen"></div>
            <div id="rep-cuerpo" aria-live="polite"><p class="vacio">Cargando…</p></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/reportes.js"></script>
</body>
</html>
