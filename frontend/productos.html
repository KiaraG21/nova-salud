<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos · NovaSalud POS</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="app">
  <div class="principal">
    <header class="topbar" id="topbar"></header>
    <main class="contenido" id="contenido">
      <section class="panel lista">
        <div class="panel-cab">
          <h2>
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 3.5l10 10a3.5 3.5 0 0 1-5 5l-10-10a3.5 3.5 0 0 1 5-5zM8 8l5 5"/></svg>
            Productos
          </h2>
          <button class="btn btn-cobrar btn-mas" id="nuevo" type="button">+ Nuevo Producto</button>
        </div>

        <div class="filtros">
          <label class="pv-buscar filtro-buscar">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input id="q" type="search" placeholder="Buscar producto…" autocomplete="off" aria-label="Buscar producto">
          </label>
          <label class="filtro">Categoría: <select id="f-cat"><option value="">Todas</option></select></label>
          <label class="filtro">Estado:
            <select id="f-estado">
              <option value="">Todos</option>
              <option value="en_stock">Disponible</option>
              <option value="stock_bajo">Stock bajo</option>
              <option value="agotado">Agotado</option>
              <option value="inactivo">Inactivo</option>
            </select>
          </label>
        </div>

        <div id="tabla" aria-live="polite"><p class="vacio">Cargando productos…</p></div>
        <div class="paginacion" id="paginacion"></div>
      </section>
    </main>
  </div>

  <div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>

  <dialog class="modal modal-ancho" id="m-prod" aria-labelledby="m-prod-t">
    <form id="f-prod" novalidate>
      <h2 id="m-prod-t">Nuevo producto</h2>
      <div class="form-grid">
        <label class="campo" id="c-codigo">Código de barras *<input id="codigo" maxlength="30" inputmode="numeric"></label>
        <label class="campo">Nombre *<input id="nombre" maxlength="120"></label>
        <label class="campo">Genérico<input id="generico" maxlength="120"></label>
        <label class="campo">Laboratorio<input id="laboratorio" maxlength="120"></label>
        <label class="campo">Categoría *<select id="categoria"></select></label>
        <label class="campo">Stock mínimo *<input id="minimo" type="number" min="0" step="1" inputmode="numeric"></label>
      </div>
      <label class="check"><input type="checkbox" id="receta"> Requiere receta médica</label>
      <label class="check" id="c-activo"><input type="checkbox" id="activo"> Producto activo (se puede vender)</label>

      <fieldset class="m-bloque" id="b-pres">
        <legend>Presentaciones y precios</legend>
        <div id="pres-filas"></div>
        <button class="btn btn-borde btn-chico" type="button" id="pres-mas">+ Agregar presentación</button>
        <p class="m-ayuda" id="pres-nota"></p>
      </fieldset>

      <p class="alerta-error" id="p-error" role="alert"></p>
      <div class="m-botones">
        <button class="btn btn-borde" id="p-cancelar" type="button">Cancelar</button>
        <button class="btn btn-cobrar" id="p-guardar" type="submit">Guardar</button>
      </div>
    </form>
  </dialog>

  <dialog class="modal modal-ancho" id="m-ver" aria-labelledby="m-ver-t">
    <h2 id="m-ver-t"></h2>
    <div id="ver-cuerpo"></div>
    <div class="m-botones uno"><button class="btn btn-borde" id="ver-cerrar" type="button">Cerrar</button></div>
  </dialog>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/productos.js"></script>
</body>
</html>
