<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuarios y Roles · NovaSalud POS</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="app">
  <div class="principal">
    <header class="topbar" id="topbar"></header>
    <main class="contenido" id="contenido">
      <section class="panel lista">
        <div class="panel-cab">
          <h2>
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2 20a7 7 0 0 1 14 0M17 11a3 3 0 1 0 0-6M22 19a6 6 0 0 0-4-5.6"/></svg>
            Usuarios y Roles
          </h2>
          <button class="btn btn-cobrar btn-mas" id="nuevo" type="button">+ Nuevo Usuario</button>
        </div>

        <div id="tabla" aria-live="polite"><p class="vacio">Cargando usuarios…</p></div>
      </section>
    </main>
  </div>

  <div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>

  <dialog class="modal modal-ancho" id="m-form" aria-labelledby="m-form-t">
    <form id="f-form" novalidate>
      <h2 id="m-form-t"></h2>
      <div class="form-grid">
        <label class="campo">Nombre *<input id="f-nombre" maxlength="80"></label>
        <label class="campo">Correo *<input id="f-correo" type="email" maxlength="120" autocomplete="off"></label>
        <label class="campo">Rol *
          <select id="f-rol">
            <option value="administrador">Administrador</option>
            <option value="vendedor">Vendedor</option>
            <option value="almacen">Almacén</option>
          </select>
        </label>
        <label class="campo"><span id="f-pass-t">Contraseña *</span><input id="f-pass" type="password" minlength="8" autocomplete="new-password"></label>
      </div>
      <p class="m-ayuda" id="f-ayuda"></p>
      <p class="alerta-error" id="f-error" role="alert"></p>
      <div class="m-botones">
        <button class="btn btn-borde" id="f-cancelar" type="button">Cancelar</button>
        <button class="btn btn-cobrar" id="f-guardar" type="submit">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
