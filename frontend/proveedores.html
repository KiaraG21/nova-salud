<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proveedores · NovaSalud POS</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="app">
  <div class="principal">
    <header class="topbar" id="topbar"></header>
    <main class="contenido" id="contenido">
      <section class="panel lista">
        <div class="panel-cab">
          <h2>
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V8l9-5 9 5v13zM9 21v-6h6v6"/></svg>
            Proveedores
          </h2>
          <button class="btn btn-cobrar btn-mas" id="nuevo" type="button">+ Nuevo Proveedor</button>
        </div>

        <div class="filtros">
          <label class="pv-buscar filtro-buscar">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input id="q" type="search" placeholder="Buscar por razón social o RUC…" autocomplete="off" aria-label="Buscar proveedor">
          </label>
        </div>

        <div id="tabla" aria-live="polite"><p class="vacio">Cargando proveedores…</p></div>
        <div class="paginacion" id="paginacion"></div>
      </section>
    </main>
  </div>

  <div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>

  <dialog class="modal modal-ancho" id="m-form" aria-labelledby="m-form-t">
    <form id="f-form" novalidate>
      <h2 id="m-form-t"></h2>
      <div class="form-grid">
        <label class="campo">Razón social *<input id="f-razon" maxlength="120"></label>
        <label class="campo">RUC *<input id="f-ruc" maxlength="11" inputmode="numeric"></label>
        <label class="campo">Teléfono<input id="f-tel" maxlength="20" inputmode="tel"></label>
        <label class="campo">Correo<input id="f-correo" type="email" maxlength="120"></label>
      </div>
      <p class="alerta-error" id="f-error" role="alert"></p>
      <div class="m-botones">
        <button class="btn btn-borde" id="f-cancelar" type="button">Cancelar</button>
        <button class="btn btn-cobrar" id="f-guardar" type="submit">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/proveedores.js"></script>
</body>
</html>
